title: Unsecured Credentials
id: 9204dd83-0482-44a4-bbfa-e51528c5ffdc
status: experimental
description: Detects the use of unsecured credentials, such as plaintext passwords or unencrypted secrets, which can be exploited by adversaries to gain unauthorized access to systems or data. Unsecured credentials may be found in configuration files, scripts, or other locations where sensitive information is not properly protected.
references:
    - https://attack.mitre.org/techniques/T1552/001/
author: Asadbek Mamatkarimov
date: 2026-09-16
tags:
    - attack.credential_access
    - attack.t1552.001
logsource:
    category: process_creation
    product: windows
detection: 
    selection_findstr:
        Image|endswith: '\findstr.exe'
        CommandLine|contains: 
            - 'password'
            - 'passwd'
            - 'secret'
            - 'credential'
    selection_powershell:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|all:
            - 'Select-String'
            - 'password'
    selection_reg:
        Image|endswith: '\reg.exe'
        CommandLine|contains|all:
            - 'query'
            - 'password'
    condition: 1 of selection_*
falsepositives:
    - Администраторы и DevOps, ищущие конфиги с параметром password при отладке
    - Скрипты аудита и инвентаризации, проверяющие наличие паролей в файлах
    - Разработчики, ищущие переменные в исходном коде
level: medium